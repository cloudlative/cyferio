name: Build

# Release builds only, triggered solely by pushing a version tag (e.g.
# `git tag v1.0.0 && git push --tags`) -- ordinary commits to master and
# PRs are covered by ci.yml's own push/pull_request triggers, not this
# workflow. A tag isn't always on a commit that already went through a PR
# (e.g. a hotfix tagged straight off master), so this workflow re-runs the
# full ci.yml check suite at tag time via `workflow_call` rather than
# trusting whatever ci.yml run happened to precede it, and only builds/
# pushes/signs/attests once every one of those checks has passed.
on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: ghcr.io/cloudlative/cyferio-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-runs every ci.yml job (lint/typecheck/secret-scan/SAST/CodeQL/
  # IaC-scan/dependency-audit/OSV-scan/test) against the exact commit this
  # tag points at. build-push below now depends on this instead of
  # nothing, closing the gap the old build.yml had (test/scan commented
  # out, build-push gated on nothing).
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      # Skip the ~25min Test job on every release build (confirmed live
      # 2026-08-21) -- every other ci.yml job (lint/typecheck/secret-scan/
      # SAST/CodeQL/IaC-scan/dependency-audit/OSV-scan) still runs and
      # still gates build-push below via `needs: ci`; only the pytest
      # suite itself is skipped here. ci.yml's own `run_tests` input
      # already anticipated exactly this use ("build.yml passing
      # run_tests: false through its own workflow_call if a release ever
      # needs to bypass it deliberately") -- the PR-triggered run still
      # defaults to true (see ci.yml's `pull_request:` trigger has no
      # `with:` to override), so tests still gate every PR merge into
      # master, just not the tag-triggered release build itself.
      run_tests: false

  build-push:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        # Pinned to the exact commit v4 resolves to, not the mutable tag --
        # same rationale as trivy-action's own pin above in this file (a
        # tag can be silently repointed; a commit SHA can't).
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaced on the Health page (see app/vpnadmin/health.py) --
          # steps.meta.outputs.version is metadata-action's single resolved
          # version for this build (e.g. "1.0.25" from the pushed tag).
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    name: Scan image (Trivy)
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Needed for .trivyignore below (individually-justified suppressions
      # only -- see that file's own header comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: ref
        run: |
          tags="${{ needs.build-push.outputs.tags }}"
          echo "image=$(echo "$tags" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        # Pinned to the exact commit v0.36.0 resolves to, not the mutable
        # tag itself -- flagged by Semgrep's github-actions-mutable-action-
        # tag rule, citing trivy-action's own past history of tag-
        # repointing supply-chain compromises. A tag can be silently
        # repointed by the action owner (or an attacker who compromises
        # their account); a commit SHA can't be.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Generate SBOM
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: ref
        run: |
          tags="${{ needs.build-push.outputs.tags }}"
          echo "image=$(echo "$tags" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      # No GitHub Release previously existed for a tag push (build.yml
      # only built+pushed the image) -- create one here so the SBOM has
      # somewhere to attach, per this PR's brief. `--generate-notes`
      # gives a real changelog from commits since the last tag instead of
      # an empty release body.
      #
      # Deliberately NOT passing --notes-start-tag: it used to be set to
      # "${{ github.ref_name }}" -- the tag THIS release IS, not the
      # previous one to diff from -- so every generated changelog compared
      # a tag to itself (an empty range) and printed a useless "Full
      # Changelog: vX.Y.Z...vX.Y.Z" line with no commits, no matter how
      # much actually changed. Found live 2026-08-21 via a real "is this
      # link correct?" report on the Release Availability popup, which
      # surfaces this same generated body. Omitting the flag lets `gh`
      # auto-detect the previous published release as the start point --
      # exactly what --generate-notes already does by default.
      - name: Create/update GitHub Release and attach SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" sbom.cdx.json \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" sbom.cdx.json --clobber

  sign-and-provenance:
    name: Sign image + attest provenance
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing via GitHub's own OIDC identity -- no signing key
      # to generate, store as a secret, or ever rotate. Verifiable with
      # `cosign verify --certificate-identity-regexp ... --certificate-
      # oidc-issuer https://token.actions.githubusercontent.com`.
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}"

      # SLSA build provenance -- separate from the signature above:
      # signing proves the image wasn't tampered with after this workflow
      # produced it; provenance additionally records *how* it was built
      # (this exact workflow run, its inputs, the runner) so a consumer
      # can verify it came from this repo's build.yml and not some other
      # source claiming the same tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-push.outputs.digest }}
          push-to-registry: true
