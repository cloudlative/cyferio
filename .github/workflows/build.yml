name: Build

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/cloudlative/openvpn-toolkit-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # TEMPORARILY DISABLED (test + scan below) to speed up rapid iteration --
  # re-enable both by uncommenting this job and restoring `needs: test` on
  # build-push below, once the current fast-iteration phase is done. Don't
  # leave this disabled long-term -- it's the only thing gating a bad
  # commit from getting built and shipped.
  # test:
  #   name: Test
