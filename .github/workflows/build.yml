  #   defaults:
  #     run:
  #       working-directory: app
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #
  #     - name: Install dependencies
  #       run: pip install -r requirements-dev.txt
  #
  #     - name: Run tests
  #       run: pytest -v

  build-push:
    name: Build and push image
    # needs: test  -- temporarily removed, see the commented-out test job above
    # Release builds only: ordinary commits to master (and PRs) only run
    # the test job above. A new image is published solely by pushing a
    # version tag, e.g. `git tag v1.0.0 && git push --tags`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaced on the Health page (see app/vpnadmin/health.py) --
          # steps.meta.outputs.version is metadata-action's single resolved
          # version for this build (e.g. "1.0.25" from the pushed tag).
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

