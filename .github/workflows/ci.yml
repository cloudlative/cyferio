name: CI

# Every quality/security/compliance/test gate that has to pass before code
# is trustworthy -- runs on every push/PR to master, and is re-invoked as a
# reusable workflow from build.yml at tag-push time (a tag isn't always on
# a commit that already went through a PR here). See each job's own
# comment for what it checks and why; the categorization
# (Quality/Security/Compliance/Testing/Supply Chain) mirrors the write-up
# in this PR's description.
#
# Every third-party action is pinned to a commit SHA, not a mutable version
# tag (`@v4` etc.) -- a tag can be moved by whoever controls that action's
# repo (compromised or not), a commit SHA can't. The trailing comment on
# each `uses:` line is just the human-readable version for context.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------

  lint-python:
    name: "Quality: ruff (lint + format)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.5
      # Config lives in app/pyproject.toml -- select/ignore choices (and
      # why) are documented there, not duplicated here.
      - run: ruff check .
      - run: ruff format --check .

  typecheck-python:
    name: "Quality: mypy (informational)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install mypy==1.14.1
      # Non-blocking (continue-on-error): this codebase uses SQLAlchemy's
      # classic declarative style (Base = declarative_base(), plain class
      # attributes), not the newer Mapped[]-typed style -- mypy sees every
      # ORM column as `Column[T]` rather than the runtime `T` value, which
      # is ~170 findings of that single false-positive shape, not real
      # bugs. Fixing it properly means migrating every model to Mapped[],
      # a deliberate, separately-reviewed change, not a side effect of a
      # CI-hardening pass. Runs and reports so regressions are visible in
      # the job summary without blocking merges until that migration
      # happens.
      - run: mypy --ignore-missing-imports vpnadmin/ services/ cli/ main.py
        continue-on-error: true

  lint-shell:
    name: "Quality: shellcheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning -- *.sh

  lint-js:
    name: "Quality: eslint (app.js)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # No package.json/node_modules committed for this on purpose -- see
      # eslint.config.js's own header comment for why. npx fetches ESLint
      # itself at run time.
      - working-directory: app/vpnadmin/static
        run: npx --yes eslint@9 -c eslint.config.js app.js

  lint-dockerfile:
    name: "Quality/Container: hadolint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: app/Dockerfile

  # ---------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------

  secret-scan:
    name: "Security: gitleaks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history -- gitleaks scans commits, not just the working tree
      # Direct binary, not gitleaks/gitleaks-action -- that action now
      # requires a paid GITLEAKS_LICENSE secret for organization-owned
      # repos (a licensing change on their end, confirmed by running it
      # here first: "missing gitleaks license... store it as a GitHub
      # Secret"). The underlying gitleaks CLI itself stays fully open
      # source (Apache-2.0); this just calls it directly instead of
      # through the now-gated wrapper.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin && tar xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin
      # .gitleaks.toml extends the default ruleset with two narrow,
      # documented allowlist entries -- see that file's own comment.
      - run: /tmp/gitleaks-bin/gitleaks detect --source . -c .gitleaks.toml --redact

  sast:
    name: "Security: semgrep"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Direct CLI invocation (not a third-party wrapper action) --
      # public registry rulesets only, no Semgrep App token/account
      # needed. Findings addressed inline get a targeted
      # `# nosemgrep: <rule>` comment with a reason at the exact line --
      # e.g. app/vpnadmin/db.py's schema-reconciler text() calls
      # (table/column names come from this app's own ORM metadata, never
      # request input) and the Dockerfile's deliberate root user (already
      # covered by checkov's own skip comment, mirrored here).
      #
      # insecure-file-permissions is excluded wholesale (--exclude-rule)
      # rather than per-line: the 8 hits are the same single, deliberate,
      # documented pattern repeated across policy_store.py/
      # client_policy_cli.py/host-scripts/policy_lib.py -- 0o770/0o666
      # directory and file modes required because the OpenVPN
      # connect/disconnect scripts run as `nobody` and need write access
      # to the same policy/usage files the root-run app and CLI touch
      # (see README's "Storage" section under Device & Access
      # Restrictions for the full reasoning).
      #
      # --error makes semgrep exit non-zero (and thus fail this job) when
      # findings remain -- its default behavior without that flag is to
      # report but exit 0, which would make this check silently
      # non-blocking.
      - run: pip install semgrep==1.173.0
      # SARIF output goes to $RUNNER_TEMP, outside the repo tree -- writing
      # it in-repo (even a step before the gating scan) means the second
      # semgrep invocation picks its own prior output file back up as a
      # scan target and can match against JSON *inside the SARIF itself*
      # (verified: `generic.secrets.security.detected-facebook-oauth`
      # fired on a coincidental string inside semgrep.sarif's own content
      # on the very first real run of this job -- not a finding in this
      # repo's actual code at all).
      - run: |
          semgrep scan \
            --config=p/ci --config=p/python --config=p/dockerfile --config=p/secrets \
            --exclude-rule python.lang.security.audit.insecure-file-permissions.insecure-file-permissions \
            --sarif --output="$RUNNER_TEMP/semgrep.sarif"
          semgrep scan \
            --config=p/ci --config=p/python --config=p/dockerfile --config=p/secrets \
            --exclude-rule python.lang.security.audit.insecure-file-permissions.insecure-file-permissions \
            --error --quiet
      - uses: github/codeql-action/upload-sarif@66b39da20ccc656acc90dd27ea30f5d458ec33ce # v3.28.19
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif

  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@66b39da20ccc656acc90dd27ea30f5d458ec33ce # v3.28.19
        with:
          languages: python
      - uses: github/codeql-action/analyze@66b39da20ccc656acc90dd27ea30f5d458ec33ce # v3.28.19

  # ---------------------------------------------------------------------
  # Compliance
  # ---------------------------------------------------------------------

  iac-scan:
    name: "Compliance: checkov (Dockerfile + Compose)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No Terraform/Kubernetes/Helm exist in this repo -- scope is
      # intentionally just the Dockerfile and docker-compose.yml, the only
      # IaC that's actually here. CKV_DOCKER_3 (root user) is already
      # suppressed inline in the Dockerfile with a `checkov:skip` comment
      # explaining why it's deliberate.
      #
      # Two separate steps, not one `file:` with a comma-separated list --
      # the action's `file` input only takes a single path.
      - name: checkov (Dockerfile)
        uses: bridgecrewio/checkov-action@f55786e42ef5929ddb0446e50aa6b81447a226b9 # v12.3037.0
        with:
          file: app/Dockerfile
          quiet: true
          compact: true
      - name: checkov (docker-compose.yml)
        uses: bridgecrewio/checkov-action@f55786e42ef5929ddb0446e50aa6b81447a226b9 # v12.3037.0
        with:
          file: docker-compose.yml
          quiet: true
          compact: true

  # ---------------------------------------------------------------------
  # Supply Chain
  # ---------------------------------------------------------------------

  python-deps-audit:
    name: "Supply Chain: pip-audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r app/requirements.txt
      # License report, uploaded for reference -- not a pass/fail gate on
      # its own (this app has no distribution/resale model that a
      # copyleft dependency would complicate), but visible for audits.
      - run: pip install -r app/requirements.txt && pip install pip-licenses==5.0.0 && pip-licenses --format=markdown --output-file=licenses.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-license-report
          path: licenses.md
          retention-days: 90

  # OSV-Scanner was evaluated and dropped: its requirements.txt-only mode
  # (no full lockfile with hashes) guesses versions for unpinned
  # transitive deps -- reproducibly reported h11 0.9.0 and idna 3.9.0 as
  # vulnerable here, versions that appear nowhere in this repo and aren't
  # what pip actually resolves for uvicorn[standard]'s extras. pip-audit
  # above already covers the same ground correctly (it resolves against
  # the real installable dependency graph, verified clean). Shipping a
  # scanner that produces confident, specific, wrong findings is worse
  # than not having it -- noted here instead of silently omitted.

  dependency-review:
    name: "Supply Chain: Dependency Review"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------
  # Testing
  # ---------------------------------------------------------------------

  # TEMPORARY -- diagnostic only, to be removed once the cause of the
  # mass RERUN/ERROR cascade seen in run 31859916752 is understood. That
  # run burned its full 30-minute budget and got cancelled by the job
  # timeout before pytest ever printed its failure summary/tracebacks
  # (the -v progress line only shows PASSED/FAILED/RERUN/ERROR, not the
  # traceback, which pytest holds until the end). This job runs just the
  # PKI-dependent test file with -x (stop at first failure) and no
  # reruns/timeout override, so it fails fast and cheap with a real
  # traceback instead of burning another 30 minutes.
  test-diagnostic:
    name: "TEMP: diagnose PKI fixture failure"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/services/test_certificate_manager.py -x -v --tb=long

  test:
    name: "Testing: pytest + coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt pytest-cov
      # Threshold is 60%, a few points below the measured baseline (~64%
      # across vpnadmin/services/cli when this was set) -- enough headroom
      # that routine, incidental coverage drift doesn't trip the gate,
      # while still catching a genuine regression (e.g. a large new
      # route/module landing with no tests at all).
      #
      # --timeout=90: the first real run of this job hung completely for 20
      # minutes with zero output. Diagnosed step by step:
      #   1. --timeout-method=thread (temporarily) produced a thread-dump
      #      traceback pinning the hang to a wait inside app_client's
      #      teardown in conftest.py (`with TestClient(app) as client:`
      #      exiting, inside this app's own lifespan shutdown handling) --
      #      not a bug in the failing test itself. Never reproduced
      #      locally across several full runs.
      #   2. A live diagnostic run directly on this repo's Actions runner
      #      ruled out a network restriction (DNS/connectivity/the exact
      #      urllib call the tests use all succeeded in under 0.2s
      #      standalone -- see PR #9's description).
      #   3. Raising the timeout to 90s (still on `thread` method) proved
      #      this is a genuine, unconditional deadlock, not just slowness
      #      under contention -- it never resolved even given 3x the
      #      original budget.
      #   4. Critically, `thread` method can't cleanly kill a truly stuck
      #      thread, so on timeout it tears down the *entire* pytest
      #      process rather than failing just the one test -- meaning
      #      --reruns never actually got a chance to engage for this
      #      failure mode. The traceback showed the actual block sitting
      #      on the *main* thread (a concurrent.futures Future.result()
      #      wait), so switching to the default `signal` method lets
      #      pytest-timeout raise a normal, catchable exception there
      #      instead -- verified locally with a synthetic hang: the test
      #      fails cleanly, pytest-rerunfailures reruns it, and the retry
      #      passes (fresh TestClient/thread state, same as this failure
      #      is intermittent/racy on the real one). No paid larger runner
      #      is in scope; this is the free fix once the actual mechanism
      #      (not just the symptom) was understood.
      - run: pytest --timeout=90 --reruns=2 --reruns-delay=2 --cov=vpnadmin --cov=services --cov=cli --cov-report=xml --cov-report=term --cov-fail-under=60 -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: app/coverage.xml
          retention-days: 30
