name: CI

# Runs on every PR targeting master, and as the check gate build.yml calls
# via `workflow_call` on every tag push -- quality, security, compliance,
# supply-chain, and test gates for this repo's actual stack (Python/
# FastAPI in app/, bash installer scripts at the repo root, one vanilla
# app.js, Docker + docker-compose). No Terraform/K8s/Helm anywhere in this
# repo, so none of that is faked here.
#
# Deliberately NOT triggered on a plain push to master (no `push:
# branches: [master]` trigger below) -- this team's actual workflow is
# push a commit to master, then immediately tag it, which used to fire
# BOTH this workflow (via that push trigger) and build.yml's own
# workflow_call invocation of it for the exact same commit: identical
# lint/test/scan jobs, running twice, doubling Actions minutes and wait
# time for zero extra safety (see conversation history 2026-08-21 -- an
# untagged push straight to master with no PR gets no CI at all under
# this setup, which matches how this repo is actually used: every real
# change is tagged and deployed, nothing is left sitting on master
# untagged for long).
#
# Every job below is independent (no artificial `needs:` chains) so they
# all run in parallel and a failure in one doesn't block the others from
# reporting.
on:
  pull_request:
    branches: [master]
  # `run_tests` (default true on every trigger) lets the Test job be
  # skipped on demand -- e.g. a manual workflow_dispatch run to quickly
  # re-check lint/security jobs alone without waiting on the ~25min test
  # suite, or build.yml passing run_tests: false through its own
  # workflow_call if a release ever needs to bypass it deliberately. Every
  # OTHER job here is unaffected -- this only gates the `test` job below.
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the Test job (uncheck to skip it)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_tests:
        description: "Run the Test job (false to skip it)"
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Quality -------------------------------------------------------
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check .
      # Not a hard gate yet: the codebase has never been through
      # `ruff format` and this PR is CI/tooling-only (no app-code edits),
      # so ~94 pre-existing files would fail a blocking check on day one.
      # Surfaced here so drift is visible; see the PR description's
      # "Follow-up" section for the plan to turn this blocking after a
      # dedicated one-time formatting pass.
      - name: ruff format --check (informational)
        continue-on-error: true
        run: ruff format --check .

  typecheck-python:
    name: Typecheck (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Informational only -- see app/mypy.ini's header comment. ~212
      # pre-existing errors as of this workflow's introduction, almost all
      # SQLAlchemy Column[T]-vs-T narrowing mypy can't see through without
      # extra stubs this repo doesn't otherwise need. Tracked as follow-up,
      # not fixed here (CI/tooling-only scope).
      #
      # continue-on-error at the *step* level, deliberately not the job
      # level: a job-level continue-on-error still reports that job's
      # overall check run as failed (red X) in the PR checks list even
      # though it doesn't block merge -- only step-level continue-on-error
      # makes the job's own check genuinely green while still logging the
      # failure inline for visibility.
      - name: mypy
        continue-on-error: true
        run: mypy .

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        # --severity=error: this repo has never been linted before: the
        # default (style/info-level) severity turns up ~20 pre-existing
        # SC2162/SC2034/SC2164 findings across the installer scripts (see
        # PR description's "Follow-up" section). error-level is clean on
        # current master and catches genuine correctness bugs (unquoted
        # expansions that break on spaces, etc).
        run: shellcheck --severity=error ./*.sh

  lint-js:
    name: Lint app.js (eslint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: eslint
        run: npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs app/vpnadmin/static/*.js

  lint-dockerfile:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: app/Dockerfile
          # Two pre-existing DL3018/DL3013 ("pin versions in apk add/pip
          # install") warnings on current master -- see PR description's
          # "Follow-up" section. error-level only, so those don't block.
          failure-threshold: error

  # ---- Security --------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 refuses to run at all on any
      # organization-owned repo without a paid GITLEAKS_LICENSE secret
      # ("cloudlative is an organization. License key is required.") --
      # confirmed live on this repo, not assumed from docs; true
      # regardless of the repo's public/private visibility. Running the
      # underlying open-source gitleaks CLI directly instead: same
      # detection engine, same .gitleaks.toml config, no license needed.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      # On a pull_request, scan only the commits this PR actually
      # introduces (base.sha..head.sha) -- not this PR's diff against a
      # single-commit baseline, but genuinely new commits. Scanning full
      # history (--log-opts unset) on every PR run is wrong for a busy
      # repo with multiple concurrent branches: `actions/checkout`
      # fetches every remote branch's history, and gitleaks scans every
      # ref reachable from what got fetched -- so a PR run would flag
      # *any* branch's pre-existing findings repo-wide, forever, not just
      # what that PR introduces (confirmed live: a concurrent, unrelated
      # branch's commit showed up as a "new" finding on this PR's own
      # run). Full-history scans still make sense on push to master
      # (catches anything that slipped past PR review) and are cheap
      # enough to run every time.
      - name: gitleaks (PR diff only)
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --redact -v --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: gitleaks (full history)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --redact -v

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `semgrep scan`, not `semgrep ci` -- the `ci` subcommand's
      # PR-only-diff filtering and Semgrep App login/dashboard integration
      # aren't needed here (no Semgrep App account, see PR description's
      # "deliberately excluded" list), just a plain SARIF-producing scan
      # of the whole tree, uploaded to the Security tab like every other
      # scanner in this workflow.
      #
      # Not a hard gate (continue-on-error): this repo has never run
      # semgrep before -- 49 pre-existing findings across app code on
      # first scan (mostly python.lang.security.audit.insecure-file-
      # permissions from openvpn-install.sh's own 0o770/0o666 PKI-file
      # permission choices, mirrored in the Python port under services/).
      # Fixing those is real app-code editing, out of scope for a
      # CI/tooling-only PR -- see the PR description's "Follow-up"
      # section for the full list and a suggested triage.
      - name: semgrep
        continue-on-error: true
        run: semgrep scan --sarif --output semgrep.sarif --config p/ci --config p/python --config p/dockerfile
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  # ---- Compliance --------------------------------------------------------
  iac-scan:
    name: IaC scan (checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed directly rather than via bridgecrewio/checkov-action --
      # verified locally that checkov (3.3.11, matching that action's
      # pinned image) has no dedicated docker-compose policy pack in this
      # version (only `dockerfile`, `kubernetes`, `terraform`, etc. --
      # `--framework docker_compose` errors as unrecognized). Scanning
      # docker-compose.yml still has value here as a secrets/YAML pass
      # (redundant with gitleaks, but cheap and catches the same class of
      # mistake from a second angle); the real policy coverage is the
      # Dockerfile scan. Two pre-existing findings there: CKV_DOCKER_2 (no
      # HEALTHCHECK) and CKV_DOCKER_3 (no non-root USER) -- both
      # deliberate (see app/Dockerfile's own comments: the container needs
      # root to read/write the bind-mounted, root-owned /etc/openvpn and
      # run easyrsa) rather than oversights, but left for follow-up
      # discussion rather than silently suppressed.
      - name: Install checkov
        run: pip install checkov
      - name: checkov (soft-fail -- see job comment)
        run: |
          checkov -f app/Dockerfile -f docker-compose.yml \
            -o cli -o sarif \
            --output-file-path console,checkov-results.sarif \
            --compact --soft-fail
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ---- Supply chain -------------------------------------------------
  python-deps-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit + pip-licenses
        run: pip install pip-audit pip-licenses
      - name: pip-audit (vulnerabilities)
        run: pip-audit -r requirements.txt
      - name: pip-licenses (report only)
        if: always()
        run: |
          pip install -r requirements.txt
          pip-licenses --format=markdown --output-file=licenses.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-licenses
          path: app/licenses.md

  osv-scan:
    name: OSV scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./app
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@v5.0.0

  # ---- Testing --------------------------------------------------------
  test:
    name: Test
    # `inputs.run_tests` is only populated on a workflow_dispatch/
    # workflow_call trigger -- on a plain pull_request run it resolves to
    # null, and `null != false` is true, so the job still runs by default
    # there too. Only an explicit `false` (dispatch input unchecked, or
    # build.yml passing run_tests: false) skips it.
    if: ${{ inputs.run_tests != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # app/tests/services/test_certificate_manager.py's session-scoped PKI
      # fixture calls services.openvpn.certificate_manager.
      # generate_tls_crypt_key(), which shells out to the real `openvpn
      # --genkey --secret` binary (not just easyrsa/openssl) -- confirmed
      # missing on ubuntu-24.04 runners by default (34 test errors,
      # "Command not found: 'openvpn'", on this PR's first live CI run).
      # ubuntu-24.04 ships openvpn 2.6.x in its default apt repos, same
      # major version openvpn-install.sh itself installs in production.
      - name: Install openvpn (needed by the cert-manager test fixture)
        # Four DIFFERENT hangs seen live on this one step, none of which
        # was what it first looked like -- each fix below was verified
        # against the actual job log, not guessed:
        #
        # 1. ubuntu-24.04 runners ship needrestart, which pops an
        #    interactive "which services should be restarted?" prompt
        #    whenever apt installs a package registering a systemd service
        #    (openvpn does). Step-level `env: {DEBIAN_FRONTEND,
        #    NEEDRESTART_MODE}` does NOT reach it -- sudo resets the
        #    environment by default -- so the fix is needrestart's own
        #    conf.d file instead ('a' = restart automatically, no prompt).
        # 2. GitHub's ubuntu-24.04 image runs apt-daily.service/apt-daily-
        #    upgrade.service in the background right after boot, holding
        #    /var/lib/dpkg/lock-frontend. `apt-get update` fetches every
        #    package index just fine (~25s, confirmed in the log) and then
        #    goes completely silent waiting on that lock -- not a network
        #    stall, a lock wait with no progress output. Stopping those
        #    units and waiting (bounded) for the lock to actually free
        #    removes the wait instead of racing it.
        # 3. `apt-get install` itself hung for the full 90s and got killed
        #    (exit 124) on one run -- the needrestart conf.d file
        #    apparently doesn't cover every prompt path. Redirecting stdin
        #    from /dev/null is the universal fix: whatever is reading
        #    stdin gets immediate EOF and fails fast instead of blocking
        #    forever, regardless of which specific tool is asking.
        # 4. Even with all of the above, `apt-get update` itself still
        #    stalled silently after fetching every index (same symptom as
        #    #2, but the lock-wait loop broke instantly that run -- so a
        #    genuinely flaky mirror connection, not the lock) and got
        #    killed by its own 90s timeout -- on a run where the IDENTICAL
        #    workflow content had just succeeded moments earlier on a
        #    different runner. That's runner-to-runner network flakiness,
        #    not a deterministic bug -- a `timeout`-bounded retry loop is
        #    the correct tool for exactly this, not a 5th one-off patch.
        run: |
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          for i in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1 || break
            [ "$i" = 60 ] && { echo "dpkg/apt lock never freed after 60s" >&2; exit 1; }
            sleep 1
          done
          sudo mkdir -p /etc/needrestart/conf.d
          echo "\$nrconf{restart} = 'a';" | sudo tee /etc/needrestart/conf.d/50-autorestart.conf
          for i in 1 2 3; do
            echo "apt-get update: attempt $i"
            sudo timeout 90 apt-get update < /dev/null && break
            [ "$i" = 3 ] && { echo "apt-get update kept failing/stalling after 3 attempts" >&2; exit 1; }
          done
          for i in 1 2 3; do
            echo "apt-get install: attempt $i"
            sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y openvpn < /dev/null && break
            [ "$i" = 3 ] && { echo "apt-get install kept failing/stalling after 3 attempts" >&2; exit 1; }
          done
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # --timeout=120: a genuine hang (see git history's fix to
        # main.py's lifespan shutdown, commit 71191ef) fails clearly
        # instead of running to this job's 25m ceiling.
        # --reruns=1: defensive-only. A previous CI attempt (PR #9, before
        # that lifespan fix landed) saw an intermittent runner-only
        # TestClient-teardown deadlock and a flaky network-dependent
        # fixture; neither reproduced across a clean local run of the full
        # suite (467 passed, 1 skipped, 0 failures) after that fix, but
        # --reruns is cheap insurance against genuine runner-only flakes
        # this local run can't rule out. See the PR description for the
        # full story.
        # --cov-fail-under=65: measured baseline was 70% on a clean local
        # run (`pytest --cov=vpnadmin --cov-report=term-missing`); 65 is a
        # small buffer under that, not a round number picked from nowhere.
        run: |
          pytest -v --timeout=120 --reruns=1 \
            --cov=vpnadmin --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=65
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-xml
          path: app/coverage.xml
