# mypy configuration for the FastAPI app (see .github/workflows/ci.yml's
# typecheck-python job, which runs this informationally/non-blocking --
# the codebase is not mypy-clean yet: ~212 pre-existing errors as of this
# file's introduction, mostly SQLAlchemy Column[T] vs. plain-T narrowing
# that mypy can't see through without the sqlalchemy2-stubs/plugin this
# repo doesn't otherwise need. Surfacing them in CI output (without
# blocking merges on them) is the point -- see the CI PR description's
# "Follow-up" section for a summary and a suggested path to blocking
# enforcement (e.g. per-module `disallow_untyped_defs` opt-in, tightened
# module by module, rather than a single repo-wide flip).
[mypy]
python_version = 3.12
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
