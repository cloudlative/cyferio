{% extends "base_email.html" %}
{% block content %}
<h2 style="margin:0 0 12px;font-size:1.2rem;">{{ headline }}</h2>
<p style="color:#aab2cc;line-height:1.6;margin:0 0 18px;">
	Ticket <strong style="color:#f1f3fa;">#{{ ticket_id }}</strong> -- {{ subject }}
</p>
{% if body_text %}
<div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:16px 20px;margin:0 0 22px;">
	<p style="margin:0;color:#dfe3f5;font-size:0.9rem;line-height:1.6;white-space:pre-wrap;">{{ body_text }}</p>
</div>
{% endif %}
{% if portal_url %}
<div style="text-align:left;">
	<a href="{{ portal_url }}{{ ticket_path }}" style="display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6,#22d3ee);color:#ffffff;font-weight:700;font-size:0.92rem;text-decoration:none;padding:12px 28px;border-radius:999px;">View Ticket</a>
</div>
{% endif %}
{% endblock %}
