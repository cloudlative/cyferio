# Pinned so the Compose project name stays "app" (matching what it always
# was, back when this file lived in app/ and Compose inferred the project
# name from the containing directory) regardless of which directory it's
# run from now that it's at the repo root -- keeps it bound to the existing
# `app_pgdata`/`app_traefik-acme` named volumes and the containers already
# running under that project, instead of Compose inferring a new project
# name from the repo root's directory name (e.g. "cyferio") and trying to
# stand up parallel volumes/containers alongside them.
name: app

services:
  # Renders app/traefik/dynamic.yml.tmpl -> the traefik-dynamic-config volume,
  # substituting ${APP_DOMAIN} and ${CLIENT_IP_TRUST_MIDDLEWARE} from .env --
  # so the routing hostname and Cloudflare-enforcement choice are genuinely
  # driven by .env, not hardcoded in the repo (Traefik's file provider has no
  # ${VAR} expansion of its own, unlike this compose file). Deliberately a
  # plain shell `sed`, not full envsubst/gettext, since there's only a
  # handful of plain-scalar variables to substitute -- no extra package
  # install needed on top of a bare alpine image. Runs once per `docker
  # compose up`; changing APP_DOMAIN/CLIENT_IP_TRUST_MIDDLEWARE and
  # re-running `up` re-renders and Traefik's own --providers.file.watch=true
  # picks up the change without a restart.
  traefik-config:
    image: alpine:3.20
    container_name: cyferio-traefik-config
    restart: "no"
    env_file: .env
    volumes:
      - ./app/traefik/dynamic.yml.tmpl:/tmpl/dynamic.yml.tmpl:ro
      - traefik-dynamic-config:/out
    # Every $ meant to reach the container's own shell unevaluated is
    # doubled ($$) -- Compose interpolates ${VAR}/$VAR anywhere in this
    # file's text, including inside this embedded script, with no
    # awareness of shell quoting/escaping conventions; $$ is Compose's own
    # escape for "a literal $, don't touch it here" (see Compose's env
    # interpolation docs). Verified with `docker compose config` that the
    # container actually receives the literal search patterns
    # "${APP_DOMAIN}"/"${CLIENT_IP_TRUST_MIDDLEWARE}" (matching the
    # template's placeholders) and the real values on the replacement side.
    # CLIENT_IP_TRUST_MIDDLEWARE defaults to "allow-all" (no enforcement) so
    # an existing deployment's .env -- which won't have this var until
    # setup-new-machine.sh is re-run -- keeps rendering exactly as it always
    # has, never silently starts enforcing an IP allowlist on redeploy.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        : "$${APP_DOMAIN:?APP_DOMAIN must be set in .env -- see .env.example}"
        CLIENT_IP_TRUST_MIDDLEWARE="$${CLIENT_IP_TRUST_MIDDLEWARE:-allow-all}"
        sed \
          -e "s/\$${APP_DOMAIN}/$$APP_DOMAIN/g" \
          -e "s/\$${CLIENT_IP_TRUST_MIDDLEWARE}/$$CLIENT_IP_TRUST_MIDDLEWARE/g" \
          /tmpl/dynamic.yml.tmpl > /out/dynamic.yml
        echo "Rendered Traefik dynamic.yml for APP_DOMAIN=$$APP_DOMAIN CLIENT_IP_TRUST_MIDDLEWARE=$$CLIENT_IP_TRUST_MIDDLEWARE"

  traefik:
    image: traefik:v3.5
    container_name: cyferio-traefik
    restart: unless-stopped
    depends_on:
      traefik-config:
        condition: service_completed_successfully
    command:
      # File provider (see app/traefik/dynamic.yml.tmpl), not the usual
      # Docker-socket provider -- this host's Docker Engine enforces a
      # MinAPIVersion that Traefik's bundled Docker client can't satisfy
      # (see dynamic.yml.tmpl's comment for the full story). One fixed
      # backend, so static routing config is simpler here anyway, and avoids
      # mounting docker.sock at all.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP -> HTTPS redirect, applied globally at the entrypoint so it
      # covers every router without needing a redirect middleware label on
      # each one.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # ACME / Let's Encrypt via HTTP-01 (needs entrypoint 80 reachable from
      # the public internet -- see task notes on the DO firewall).
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Toggle to Let's Encrypt's staging directory first (see .env.example)
      # to avoid burning production rate-limit attempts while the config is
      # still being verified; leave unset/empty for the real production CA.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Internal API for the Health page (see app/vpnadmin/health.py's
      # get_traefik_health) to read router/service status from. Bound to
      # its own "traefik" entrypoint on port 8080, which is deliberately
      # NOT published below in `ports:` -- reachable only from other
      # containers on this compose network (i.e. just the app service),
      # never from the public internet. The dashboard UI stays off
      # (api.dashboard defaults to false); only the JSON endpoints are
      # used. The router that actually exposes api@internal on this
      # entrypoint is defined in app/traefik/dynamic.yml (this file's
      # File provider needs it explicit -- see that file's own comment).
      - --entrypoints.traefik.address=:8080
      - --api=true
      - --ping=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/letsencrypt
      - traefik-dynamic-config:/etc/traefik/dynamic:ro
    env_file: .env

  app:
    # Pulled from GHCR (public image, built by .github/workflows/build.yml on
    # every push to master) rather than built locally -- production just
    # does `docker compose pull && docker compose up -d`. Pin IMAGE_TAG in
    # .env (e.g. sha-abc1234 from a specific Actions run) to deploy an exact
    # version instead of always tracking latest; unset it and it defaults to
    # latest.
    image: ghcr.io/cloudlative/cyferio-app:${IMAGE_TAG:-latest}
    container_name: cyferio-app
    restart: unless-stopped
    # Runs Docker's built-in tini as PID 1 instead of uvicorn directly.
    # Belt-and-suspenders zombie reaper: uvicorn/Python never calls wait()
    # on children it didn't spawn itself, so any orphaned grandchild left
    # behind by openvpn-install.sh/vpn-status.py (e.g. the process-
    # substitution zombie leak fixed in do_check_consistency) would
    # otherwise sit as a zombie forever and eventually exhaust the
    # container's pids cgroup limit -- exactly what happened in production
    # on 2026-08-10. tini reaps anything reparented to PID 1 automatically.
    init: true
    env_file: .env
    # No public host port: Traefik (above) is the only public entrypoint now.
    # Uncomment the line below to bind the app port to the VPN-internal
    # interface for direct debugging without going through Traefik/DNS --
    # never bind it to a public interface (0.0.0.0 or the droplet's public
    # IP) alongside Traefik, that would leave an unauthenticated bypass.
    # ports:
    #   - "10.8.0.1:8000:8000"
    # Routing (Host rule, TLS, backend port) is defined in
    # app/traefik/dynamic.yml rather than labels here -- see that file's
    # comment for why.
    # openvpn-install.sh unconditionally probes /dev/net/tun at startup
    # (even for read-only commands like --list-users/--check-certs) as a sanity check
    # that OpenVPN could run on this host -- pass the device through rather
    # than granting --privileged.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      # --- REQUIRED: gives the app the same access a human running
      #     openvpn-install.sh/vpn-status.py directly on the host would
      #     have. rw on /etc/openvpn because --add-user/--revoke-user write there
      #     (new certs, openvpn_db.txt updates); ro on the log dir since
      #     the status tool only ever reads it.
      - /etc/openvpn:/etc/openvpn
      - /var/log/openvpn:/var/log/openvpn:ro

      # --- REQUIRED: the actual scripts this app wraps, bind-mounted from
      #     this repo root (this compose file's own directory now that it
      #     lives at the repo root, no longer app/) so the container always
      #     runs whatever's checked out on the host (no image rebuild to
      #     pick up a script change). Point OPENVPN_INSTALL_SCRIPT/
      #     VPN_STATUS_SCRIPT in .env at these same in-container paths.
      - ./openvpn-install.sh:/opt/cyferio/openvpn-install.sh:ro
      - ./vpn-status.py:/opt/cyferio/vpn-status.py:ro

      # --- Only needed in SQLite mode (default) -- persists the app's own
      #     database (users, audit log) across container recreation. Not
      #     used if DATABASE_URL in .env points at the postgres service
      #     below instead.
      - ./app/data:/app/data

      # --- Health page (see app/vpnadmin/health.py's get_host_health):
      #     the HOST's /proc, /sys, and root filesystem, all read-only, so
      #     the app can report the droplet's real CPU/RAM/disk/uptime
      #     rather than this one container's own cgroup-limited view.
      #     Read-only means nothing running in the container can write
      #     through these paths, only read them -- the same mount pattern
      #     node_exporter and similar host-monitoring tools use. Mount
      #     targets match config.py's HOST_PROC_PATH/HOST_SYS_PATH/
      #     HOST_ROOT_PATH defaults.
      - /proc:/hostproc:ro
      - /sys:/hostsys:ro
      - /:/hostfs:ro

      # --- Phase 1 host_executor.py (live OpenVPN session actions,
      #     vpnadmin/routes/clients.py): a scoped SSH deploy key,
      #     read-only, always mounted at the fixed in-container path
      #     /run/secrets/cyferio-deploy-key (matches config.py's
      #     HOST_SSH_KEY_PATH default). HOST_SSH_KEY_SOURCE_PATH below picks
      #     WHERE ON THE HOST that key actually lives -- deliberately a
      #     different env var than HOST_SSH_KEY_PATH, even though both
      #     default to conceptually "the same key": this line's
      #     interpolation runs on the HOST at `docker compose up` time, but
      #     env_file: .env ALSO passes every var in .env straight into the
      #     container's own environment -- reusing one name for both the
      #     host-side source and the in-container path this app reads from
      #     would mean whichever one .env sets silently overrides the other.
      #     Deliberately NOT the same privilege as the mounts above -- this
      #     key should be restricted host-side (authorized_keys `command=`
      #     forced-command wrapper, see the migration plan's §2a) to running
      #     exactly app/cli/openvpn_admin.py, nothing else. Commented out by
      #     default: the live-session actions (Clients page) fail soft with
      #     a clear 400/empty list (see clients.py's _host_executor_config)
      #     until this is set up, same fail-soft pattern SMTP already uses.
      # - ${HOST_SSH_KEY_SOURCE_PATH:-./secrets/cyferio-deploy-key}:/run/secrets/cyferio-deploy-key:ro
    # This app manipulates root-owned files under /etc/openvpn and runs
    # easyrsa, so it runs as root inside the container (the image's
    # default user). USE_SUDO=false in .env reflects that no privilege
    # escalation is needed once already running as root.
    depends_on:
      - traefik

  # Set DATABASE_URL in .env to a postgresql:// URL pointing at this service
  # to use it instead of the default SQLite file (see .env.example).
  postgres:
    image: postgres:16-alpine
    container_name: cyferio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vpnadmin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host at all -- only the app service (on the same
    # compose network) needs to reach it, over its DATABASE_URL using the
    # service name "postgres" as the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnadmin} -d ${POSTGRES_DB:-vpnadmin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  traefik-acme:
  traefik-dynamic-config:
  pgdata:
