# gitleaks config (see .github/workflows/ci.yml's secret-scan job).
#
# Extends gitleaks' own default ruleset rather than replacing it, and adds
# a narrow, individually-justified allowlist -- same discipline as
# .trivyignore's own header comment: every entry here is investigated
# before being added, never a blanket suppression.
[extend]
useDefault = true

[allowlist]
description = "Known false positives, individually justified below"
regexes = [
  # "brandnewpass123" -- a literal, hardcoded test fixture password used by
  # app/tests/test_auth.py to exercise the password-change endpoint
  # (wrong-current-password, too-short-new-password, and success cases).
  # Its entropy is high enough to trip the generic-api-key heuristic, but
  # it is not a credential to any real system -- it only ever reaches an
  # in-memory SQLite DB created fresh per test (see tests/conftest.py's
  # db_session fixture) and is never used outside this test file.
  '''brandnewpass123''',
]

# Note: setup.sh's MAXMIND_KEY default used to be here as an allowlist entry
# (`MAXMIND_KEY=""` tripping generic-api-key) but the regex never actually
# matched gitleaks' allowlist target in practice -- it kept re-flagging on
# every full-history scan regardless. Fixed at the source instead: setup.sh
# now declares it as an unquoted empty assignment (`MAXMIND_KEY=`), which
# has no quoted literal for the heuristic to match against at all, so
# nothing needs allowlisting here anymore.
